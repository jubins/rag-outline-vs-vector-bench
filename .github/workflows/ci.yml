name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python scripts/check_configs.py
      - name: Validate the Compose file for each profile
        run: |
          docker compose config -q
          docker compose --profile vector config -q
          docker compose --profile outline config -q
      - name: Lint the Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

  docker:
    runs-on: ubuntu-latest
    needs: [lint, test, config]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t rag-bench:ci .
      - name: Start the outline stack
        run: |
          DESIGN=outline docker compose --profile outline up -d --build --wait \
            orchestrator llm-stub localstack otel-collector tempo
      - name: Ask one question through the API
        run: |
          question=$(curl -sf "http://localhost:8000/questions?n=1" | python -c "import json,sys; q=json.load(sys.stdin)[0]; print(json.dumps({'question': q['question'], 'doc_id': q['doc_id']}))")
          curl -sf -X POST http://localhost:8000/ask -H 'Content-Type: application/json' -d "$question" | tee answer.json
          python -c "import json; a=json.load(open('answer.json')); assert a['supported'] and a['rounds'] == 1, a"
          curl -sf http://localhost:8000/metrics | grep -q rag_request_seconds_bucket
      - name: Show logs when something failed
        if: failure()
        run: docker compose --profile outline logs --no-color
      - name: Stop the stack
        if: always()
        run: docker compose --profile outline down -v
