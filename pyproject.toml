[project]
name = "rag-outline-vs-vector-bench"
version = "0.1.0"
description = "Test bench that compares vector-search RAG with an outline-based design on tail latency."
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
