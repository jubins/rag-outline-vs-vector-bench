# Start one design at a time:
#   make vector     (OpenSearch, vector search with the retry loop)
#   make outline    (LocalStack, outline-based retrieval)
name: rag-latency-bench

x-app-env: &app-env
  DESIGN: ${DESIGN:-outline}
  BACKEND: aws-local
  OPENSEARCH_URL: http://opensearch:9200
  AWS_ENDPOINT_URL: http://localstack:4566
  LLM_URL: http://llm-stub:8080
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
  EMBED_MS: ${EMBED_MS:-40}
  RERANK_MS: ${RERANK_MS:-80}
  SELECT_MS: ${SELECT_MS:-800}
  GENERATE_MS: ${GENERATE_MS:-600}

services:
  orchestrator:
    build: .
    environment: *app-env
    ports:
      - "8000:8000"
    depends_on:
      llm-stub:
        condition: service_started
      otel-collector:
        condition: service_started
      opensearch:
        condition: service_healthy
        required: false
      localstack:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 30s
    networks: [rag-net]

  llm-stub:
    build: .
    command: ["uvicorn", "llm_stub.server:app", "--host", "0.0.0.0", "--port", "8080"]
    environment:
      <<: *app-env
    ports:
      - "8080:8080"
    networks: [rag-net]

  opensearch:
    image: opensearchproject/opensearch:2.17.1
    profiles: ["vector"]
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [rag-net]

  localstack:
    image: localstack/localstack:3.8
    profiles: ["outline"]
    environment:
      SERVICES: s3,dynamodb
    ports:
      - "4566:4566"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4566/_localstack/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [rag-net]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.116.1
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./observability/otel-collector.yaml:/etc/otel/config.yaml:ro
    ports:
      - "4317:4317"
    depends_on: [tempo]
    networks: [rag-net]

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks: [rag-net]

  tempo:
    image: grafana/tempo:2.6.1
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./observability/tempo.yaml:/etc/tempo.yaml:ro
    ports:
      - "3200:3200"
    networks: [rag-net]

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on: [prometheus, tempo]
    networks: [rag-net]

  k6:
    image: grafana/k6:0.55.0
    profiles: ["vector", "outline"]
    command: ["run", "/scripts/script.js"]
    environment:
      BASE_URL: http://orchestrator:8000
      DESIGN: ${DESIGN:-outline}
      RATE: ${RATE:-5}
      DURATION: ${DURATION:-5m}
    volumes:
      - ./k6:/scripts:ro
    depends_on:
      orchestrator:
        condition: service_healthy
    networks: [rag-net]

networks:
  rag-net:
    name: rag-net
